name: SEO Blog Review (no publishing)

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "framer/**"
      - ".github/workflows/blog-automation.yml"

# No schedule, service credentials, generation spend or main-branch writes.
permissions:
  contents: read

concurrency:
  group: blog-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Test publishing safeguards
        working-directory: framer
        run: npm test
      - name: Build review plan for existing bundles
        run: node framer/publish.mjs --baseline framer/cms-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: seo-review-plan
          path: review-output/plan.json
          if-no-files-found: error
